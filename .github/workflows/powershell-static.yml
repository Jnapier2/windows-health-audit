name: PowerShell static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Parse and policy-check PowerShell
        shell: powershell
        run: ./tests/Invoke-StaticChecks.ps1
